<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Dashboard</title>
<!-- View only. Static: edit these 3 files directly. Data: Dashboard/Data/ (written by ./Tools/test-gate.sh dash). -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="project">Dashboard</h1>
    <p class="muted" id="generated"></p>
  </div>
  <div class="chips" id="health"></div>
</header>
<main>
  <section id="attention" aria-labelledby="h-attention">
    <h2 id="h-attention">1 · Cần bạn làm</h2>
    <div id="attentionBody"></div>
  </section>
  <section id="progress" aria-labelledby="h-progress">
    <h2 id="h-progress">2 · Dự án tới đâu</h2>
    <div id="progressBody"></div>
  </section>
  <section id="execution" aria-labelledby="h-execution">
    <h2 id="h-execution">3 · Thực thi (node)</h2>
    <div id="executionBody"></div>
  </section>
  <section id="anomalies" aria-labelledby="h-anomalies">
    <h2 id="h-anomalies">4 · Bất thường</h2>
    <div id="anomaliesBody"></div>
  </section>
  <section id="details" aria-labelledby="h-details">
    <h2 id="h-details">Chi tiết</h2>
    <div id="detailsBody"></div>
  </section>
</main>
<p class="muted foot" id="noData" hidden>Chưa có dữ liệu. Chạy <code>./Tools/test-gate.sh dash</code> rồi mở lại trang này.</p>
<script src="Data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
