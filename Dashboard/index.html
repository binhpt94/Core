<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Dashboard</title>
<!-- View only, read-only. Data: Dashboard/Data/data.js, written by ./Tools/test-gate.sh dash from
     Docs/Plan/Core.md, Docs/Plan/features.md (+ test results) and Docs/Plan/Notes.md. To change data, ask an AI to edit those files. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="project">Dashboard</h1>
    <p class="muted" id="generated"></p>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="foundation">Nền tảng dự án</button>
    <button role="tab" data-tab="progress">Tiến độ</button>
    <button role="tab" data-tab="notes">Ghi chú</button>
  </nav>
</header>
<main>
  <section id="foundation" role="tabpanel"></section>
  <section id="progress" role="tabpanel" hidden></section>
  <section id="notes" role="tabpanel" hidden></section>
</main>
<p class="muted foot" id="noData" hidden>Chưa có dữ liệu. Chạy <code>./Tools/test-gate.sh dash</code> rồi mở lại trang này.</p>
<script src="Data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
