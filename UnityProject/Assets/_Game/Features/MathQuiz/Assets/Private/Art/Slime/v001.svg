<svg xmlns="http://www.w3.org/2000/svg" width="104" height="170" viewBox="0 0 104 170">
  <!-- MathQuiz.Slime v001 (Claude): tall jelly blob, flat cartoon, thick dark outline; pivot 50/50 = canvas centre -->
