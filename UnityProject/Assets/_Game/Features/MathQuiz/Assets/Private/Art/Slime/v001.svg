  <circle cx="46" cy="22" r="4" fill="#ffffff" fill-opacity="0.75"/>
  <!-- eyes -->
  <ellipse cx="35" cy="90" rx="14" ry="17" fill="#ffffff" stroke="#173a1c" stroke-width="4"/>
  <ellipse cx="69" cy="90" rx="14" ry="17" fill="#ffffff" stroke="#173a1c" stroke-width="4"/>
  <circle cx="38" cy="95" r="8" fill="#173a1c"/>
  <circle cx="72" cy="95" r="8" fill="#173a1c"/>
  <circle cx="41" cy="91" r="3" fill="#ffffff"/>
  <circle cx="75" cy="91" r="3" fill="#ffffff"/>
  <!-- cheeks -->
  <ellipse cx="22" cy="118" rx="7" ry="4.5" fill="#ff8fa3" fill-opacity="0.8"/>
  <ellipse cx="82" cy="118" rx="7" ry="4.5" fill="#ff8fa3" fill-opacity="0.8"/>
  <!-- mouth -->
  <path d="M42 121 Q52 132 62 121" fill="none" stroke="#173a1c" stroke-width="5" stroke-linecap="round"/>
